  function consultarSickw(serviceId) {
    let imei = "";
    
    if (serviceId === 'demo') {
      imei = document.getElementById("imeiModelo").value.trim();
    } else {
      imei = document.getElementById("imeiIcloud").value.trim();
    }

  const inventario = rawData.trim().split('\n').filter(line => line.length > 0).map(line => {
    const partes = line.split('|');
    return { marca: partes[0], modelo: partes[1], calidad: partes[2], precio: partes[3] };
  });

  const lista = document.getElementById("lista-precios");

  function mostrarItems(filtro = "") {
    lista.innerHTML = ""; 
    const filtroMin = filtro.trim().toLowerCase();
    
    // Si la barra está vacía, no mostramos ningún elemento
    if (filtroMin === "") {
      return;
    }
    
    inventario.forEach(item => {
      const textoCompleto = `${item.marca} ${item.modelo} ${item.calidad}`.toLowerCase();
      
      if (textoCompleto.includes(filtroMin)) {
        const li = document.createElement("li");
        
        const claseMarca = getMarcaClass(item.marca);
        const claseCalidad = getCalidadClass(item.calidad);

        li.innerHTML = `
          <div class="info">
            <span class="marca ${claseMarca}">${item.marca}</span>
            <span class="modelo">${item.modelo}</span>
            <span class="detalles">Calidad: <span class="calidad ${claseCalidad}">${item.calidad}</span></span>
          </div>
          <div class="precio">$${item.precio}</div>
        `;
        lista.appendChild(li);
      }
    });
  }

  function buscar() {
    const texto = document.getElementById("buscador").value;
    mostrarItems(texto);
  }
